name: Validate R Notebook

on:
  push:
    branches:
      - main
      - fix/**
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Expose Quarto Pandoc to R Markdown
        shell: bash
        run: |
          # Use the actual executable on Windows as well as Linux.
          quarto_bin="$(quarto --paths | head -n 1 | tr -d '\r')"
          pandoc="$(find "${quarto_bin}" -type f \( -name pandoc -o -name pandoc.exe \) -print -quit)"
          test -n "${pandoc}"
          echo "$(dirname "${pandoc}")" >> "${GITHUB_PATH}"
      - name: Install R test dependencies
        run: Rscript -e "install.packages(c('knitr', 'rmarkdown', 'ps'))"
      - name: Verify R Markdown can use Pandoc
        run: Rscript -e "stopifnot(rmarkdown::pandoc_available())"
      - name: Install dependencies
        run: npm ci
      - name: Compile
        run: npm run compile
      - name: Unit, renderer, sidecar and real R lifecycle tests
        run: npm test
      - name: Install VS Code and notebook dependencies for UI tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/vscode"
          curl --fail --location --retry 3 https://update.code.visualstudio.com/latest/linux-x64/stable | tar -xz -C "${RUNNER_TEMP}/vscode" --strip-components=1
          "${RUNNER_TEMP}/vscode/bin/code" --user-data-dir="${RUNNER_TEMP}/code-install-profile" --extensions-dir="${RUNNER_TEMP}/vscode-extensions" --install-extension REditorSupport.r --install-extension RConsole.vsc-r-console --force
          echo "VSCODE_EXECUTABLE=${RUNNER_TEMP}/vscode/code" >> "${GITHUB_ENV}"
          echo "VSCODE_EXTENSIONS_DIR=${RUNNER_TEMP}/vscode-extensions" >> "${GITHUB_ENV}"
      - name: Visible YAML completion and notebook rendering
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a node scripts/test-integration.js yamlCompletions
          xvfb-run -a node scripts/test-integration.js rendering
      - name: Retain failed VS Code test logs
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: notebook-integration-logs
          path: /tmp/r-notebook-integration-*/**/*.log
