name: Validate R Notebook

on:
  push:
    branches:
      - main
      - fix/**
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Expose Quarto Pandoc to R Markdown
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/r-notebook-pandoc"
          cat > "${RUNNER_TEMP}/r-notebook-pandoc/pandoc" <<'EOF'
          #!/usr/bin/env bash
          exec quarto pandoc "$@"
          EOF
          chmod +x "${RUNNER_TEMP}/r-notebook-pandoc/pandoc"
          echo "${RUNNER_TEMP}/r-notebook-pandoc" >> "${GITHUB_PATH}"
      - name: Install R test dependencies
        run: Rscript -e "install.packages(c('knitr', 'rmarkdown'))"
      - name: Verify R Markdown can use Pandoc
        run: Rscript -e "stopifnot(rmarkdown::pandoc_available())"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run check-types
      - name: Unit and native renderer tests
        env:
          CHROME_PATH: google-chrome
        run: npm test
