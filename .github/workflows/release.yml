name: Release VSIX
run-name: Release ${{ github.ref_name }} (${{ inputs.release_type || 'tag' }})

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_type:
        description: Create a GitHub release or pre-release
        type: choice
        options:
          - pre-release
          - release
        default: pre-release
        required: true
      publish_open_vsx:
        description: Publish a release to the Open VSX Registry
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: release-${{ github.event.inputs.release_type || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      release_type: ${{ steps.release.outputs.release_type }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate release
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REQUESTED_RELEASE_TYPE: ${{ inputs.release_type }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version must use major.minor.patch without a SemVer pre-release suffix."
            exit 1
          fi

          if [[ "${EVENT_NAME}" == "push" ]]; then
            case "${REF_NAME}" in
              "v${version}")
                release_type="release"
                prerelease="false"
                ;;
              "v${version}-pre")
                release_type="pre-release"
                prerelease="true"
                ;;
              *)
                echo "::error::Tag ${REF_NAME} does not match package version ${version}. Use v${version} or v${version}-pre."
                exit 1
                ;;
            esac
            tag_name="${REF_NAME}"
          else
            if [[ "${REF_NAME}" != "${DEFAULT_BRANCH}" ]]; then
              echo "::error::Run manual releases from the default branch (${DEFAULT_BRANCH}), not ${REF_NAME}."
              exit 1
            fi

            release_type="${REQUESTED_RELEASE_TYPE}"
            case "${release_type}" in
              release)
                prerelease="false"
                tag_name="v${version}"
                ;;
              pre-release)
                prerelease="true"
                tag_name="v${version}-pre"
                ;;
              *)
                echo "::error::Unknown release type: ${release_type}"
                exit 1
                ;;
            esac

            git fetch --force --tags --quiet
            if git rev-parse --verify --quiet "refs/tags/${tag_name}^{commit}" >/dev/null; then
              tag_sha="$(git rev-parse "refs/tags/${tag_name}^{commit}")"
              if [[ "${tag_sha}" != "${WORKFLOW_SHA}" ]]; then
                echo "::error::Existing tag ${tag_name} points to ${tag_sha}, not this workflow commit ${WORKFLOW_SHA}."
                exit 1
              fi
            fi
          fi

          node scripts/extract-release-notes.js \
            --version "${version}" \
            --output "${RUNNER_TEMP}/release-notes-validation.md"

          {
            echo "version=${version}"
            echo "tag_name=${tag_name}"
            echo "release_type=${release_type}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

          echo "Preparing ${release_type} ${tag_name}."

  package:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install R test dependencies
        run: Rscript -e "install.packages(c('knitr', 'rmarkdown', 'htmlwidgets', 'plotly', 'DT'))"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Package release extension
        if: needs.prepare.outputs.prerelease != 'true'
        run: npm run package

      - name: Package pre-release extension
        if: needs.prepare.outputs.prerelease == 'true'
        run: npm run package:pre-release

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: vsc-r-notebook-*.vsix
          if-no-files-found: error

  publish-github:
    needs:
      - prepare
      - package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: vsix
          path: release-artifacts

      - name: Generate checksum
        run: |
          cd release-artifacts
          sha256sum *.vsix > SHA256SUMS.txt

      - name: Extract release notes from changelog
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        run: |
          node scripts/extract-release-notes.js \
            --version "${VERSION}" \
            --output release-notes.md \
            --changelog-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${TAG_NAME}/CHANGELOG.md"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: R Notebook for VS Code ${{ needs.prepare.outputs.tag_name }}
          body_path: release-notes.md
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          make_latest: ${{ needs.prepare.outputs.prerelease == 'true' && 'false' || 'true' }}
          files: |
            release-artifacts/*.vsix
            release-artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true
          overwrite_files: true

  publish-marketplace:
    if: needs.prepare.outputs.prerelease != 'true'
    needs:
      - prepare
      - package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: vsix
          path: release-artifacts

      - name: Publish VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --pat "${VSCE_PAT}" --skip-duplicate --packagePath ./release-artifacts/*.vsix

  publish-open-vsx:
    if: needs.prepare.outputs.prerelease != 'true' && (github.event_name == 'push' || inputs.publish_open_vsx)
    needs:
      - prepare
      - package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: vsix
          path: release-artifacts

      - name: Publish Open VSX Registry
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
        run: npx --yes ovsx publish --skip-duplicate --packagePath ./release-artifacts/*.vsix
