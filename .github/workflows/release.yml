name: Release VSIX
run-name: Release ${{ github.ref_name }}

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      publish_marketplace:
        description: Publish the built VSIX packages to the VS Code Marketplace
        type: boolean
        default: false
      publish_open_vsx:
        description: Publish the built VSIX packages to the Open VSX Registry
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/validate.yml

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e "const pkg=require('./package.json'); const tag=process.env.GITHUB_REF_NAME; const expected='v' + pkg.version; if(tag !== expected){throw new Error('Tag ' + tag + ' does not match package version ' + expected);}"

      - name: Install dependencies
        run: npm ci

      - name: Package extension
        run: npm run package:vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: vsc-r-notebook-*.vsix
          if-no-files-found: error

  publish-development:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Extract development release notes
        id: development-notes
        run: |
          # Prefer Unreleased; otherwise use the most recent versioned section.
          # Exclude section headings so the pre-release notes have no version or date.
          awk '
            /^## / {
              if (found) exit
              if ($0 == "## Unreleased") {
                found = 1
                next
              }
              next
            }
            found { print }
          ' CHANGELOG.md > development-release-notes.md
          if ! grep -q '[^[:space:]]' development-release-notes.md; then
            awk '
              /^## / {
                if (found) exit
                found = 1
                next
              }
              found { print }
            ' CHANGELOG.md > development-release-notes.md
          fi
          if ! grep -q '[^[:space:]]' development-release-notes.md; then
            printf 'Development build from main.\n' > development-release-notes.md
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Download VSIX artifacts
        if: steps.development-notes.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: vsix
          path: release-artifacts

      - name: Generate checksums
        if: steps.development-notes.outputs.publish == 'true'
        run: |
          cd release-artifacts
          sha256sum *.vsix > SHA256SUMS.txt

      - name: Replace development release
        if: steps.development-notes.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view development >/dev/null 2>&1; then
            gh release delete development --yes
          fi
          git tag --force development
          git push origin development --force

      - name: Publish development release
        if: steps.development-notes.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: development
          name: R Notebook Development Build
          body_path: development-release-notes.md
          prerelease: true
          make_latest: false
          files: |
            release-artifacts/*.vsix
            release-artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download VSIX artifacts
        uses: actions/download-artifact@v8
        with:
          name: vsix
          path: release-artifacts

      - name: Generate checksums
        run: |
          cd release-artifacts
          sha256sum *.vsix > SHA256SUMS.txt

      - name: Extract release notes
        run: |
          node scripts/extract-release-notes.js \
            --version "${GITHUB_REF_NAME#v}" \
            --output release-notes.md \
            --changelog-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: R Notebook ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            release-artifacts/*.vsix
            release-artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true
          overwrite_files: true

  publish-marketplace:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_marketplace)
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Download VSIX artifacts
        uses: actions/download-artifact@v8
        with:
          name: vsix
          path: release-artifacts

      - name: Publish VS Code Marketplace
        run: npx @vscode/vsce publish --oidc --skip-duplicate --packagePath ./release-artifacts/*.vsix

  publish-open-vsx:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_open_vsx)
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Download VSIX artifacts
        uses: actions/download-artifact@v8
        with:
          name: vsix
          path: release-artifacts

      - name: Publish Open VSX Registry
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
        run: npx --yes ovsx publish --skip-duplicate --packagePath ./release-artifacts/*.vsix
